services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
      - mailpit

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  apache:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    profiles: ["lamp"]
    ports:
      - "8081:80"
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: telecomos
      MYSQL_USER: telecomos
      MYSQL_PASSWORD: telecomos
      MYSQL_ROOT_PASSWORD: telecomos_root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --queue=critical,default,mail,provisioning --tries=3 --backoff=30
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan horizon
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"
      - "1025:1025"

  meilisearch:
    image: getmeili/meilisearch:v1.9
    profiles: ["search"]
    environment:
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

volumes:
  mysql-data:
  meili-data:
